name: Build and package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployment is managed at jiedanxt.oksja.cn. The legacy host and AI worker
# deployment have been retired; this workflow only produces release artifacts.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: xuancheng-order-backend
          path: ruoyi-admin/target/ruoyi-admin.jar
          if-no-files-found: error
